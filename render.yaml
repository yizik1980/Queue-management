services:
  # ── 1. NestJS Backend ─────────────────────────────────────────────────────────
  - type: web
    name: scheduler-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false          # set manually in Render dashboard (MongoDB Atlas connection string)
      - key: JWT_SECRET
        sync: false          # set manually in Render dashboard (long random string)
      - key: CORS_FRONTEND_URL
        value: https://scheduler-frontend-ees7.onrender.com
      - key: CORS_ADMIN_URL
        value: https://scheduler-admin-o2ye.onrender.com

  # ── 2. Angular Frontend ───────────────────────────────────────────────────────
  - type: web
    name: scheduler-frontend
    env: static
    rootDir: scheduler-frontend
    buildCommand: >-
      npm ci &&
      printf 'export const environment = { production: true, apiUrl: "%s/api" };\n'
      "$BACKEND_URL" > src/environments/environment.prod.ts &&
      npm run build
    staticPublishPath: dist/scheduler-frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: BACKEND_URL
        value: https://scheduler-backend-yglw.onrender.com

  # ── 3. React Admin CMS ────────────────────────────────────────────────────────
  - type: web
    name: scheduler-admin
    env: static
    rootDir: admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://scheduler-backend-yglw.onrender.com
